[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peptide-engineering-benchmark"
version = "1.0.0rc0"
description = "Peptide Engineering Benchmark release-candidate tooling."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "typer>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
]

[project.scripts]
peb = "peb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
extend-ignore = ["E501", "B008"]
