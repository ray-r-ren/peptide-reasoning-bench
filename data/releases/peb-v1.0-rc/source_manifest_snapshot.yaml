policies:
  bucket_a_open: &bucket_a_open
    raw_data_redistribution: allowed
    processed_label_redistribution: allowed
    commercial_use: allowed
    attribution_required: true
    share_alike_obligation: false
    use_in_public_leaderboard: allowed
  cautious_reference: &cautious_reference
    raw_data_redistribution: restricted
    processed_label_redistribution: unknown
    commercial_use: unknown
    attribution_required: true
    share_alike_obligation: false
    use_in_public_leaderboard: caution
  avoid_raw: &avoid_raw
    raw_data_redistribution: unknown
    processed_label_redistribution: unknown
    commercial_use: unknown
    attribution_required: true
    share_alike_obligation: false
    use_in_public_leaderboard: avoid

sources:
  - name: pdb
    module: peb.sources.pdb
    url: https://www.wwpdb.org/
    source_category: experimental_structure
    expected_fields: [pdb_id, entity_id, chain_id, experimental_method, release_date]
    license_or_usage_note: Public wwPDB archive data with attribution and source identifiers retained.
    citation: wwPDB archive and RCSB PDB data portal documentation.
    source_version: live archive snapshot
    retrieval_date_policy: Store UTC retrieval date for every fetched entry.
    redistribution_policy: *bucket_a_open
    adapter_status: implemented
    comments: Primary structure and pose source for source-backed cases.
    source_bucket: A

